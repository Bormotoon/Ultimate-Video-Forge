name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10 (pyproject.toml); 3.14 is the version this
        # project is actively developed on. Cover the full supported span with
        # no holes: 3.13 sat between the tested 3.12 and 3.14 and was claimed
        # as supported without ever being run.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyQt6 needs the Qt runtime's system libraries even under the offscreen
      # platform plugin (importing QtWidgets dlopens libEGL/libGL); bare GitHub
      # runners don't ship them all. Without this, pytest fails at COLLECTION
      # (test modules import whispersync.gui), not just in GUI tests.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies (locked on 3.12 for reproducibility; ranges elsewhere)
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -r requirements-dev.lock
          else
            pip install -r requirements-dev.txt
          fi

      - name: Ruff (lint)
        run: ruff check whispersync/ tools/ tests/

      - name: Black (format check)
        run: black --check whispersync/ tools/ tests/

      - name: Mypy (type check)
        run: mypy whispersync/ tools/ main.py

      - name: Pytest (excluding ffmpeg integration tests)
        run: pytest -q -m "not integration"

  integration:
    name: Integration tests (real ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg for the integration tests themselves; Qt runtime libs because
      # pytest imports every test module during collection (incl. GUI tests).
      - name: Install ffmpeg and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Pytest (ffmpeg integration tests only)
        run: pytest -q -m integration

  packaging:
    name: Build & smoke-test the wheel (outside the checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # The quality job above tests the SOURCE TREE with the checkout on the
      # import path (pytest's `pythonpath = ["."]`), which cannot detect
      # anything about the artifact users install: a module left out of package
      # discovery, or a resource file not declared as package data, both import
      # fine from a checkout and are simply absent from the wheel. Both of
      # those shipped. This job installs the built wheel into a clean
      # environment and runs from a directory that is NOT the checkout, so the
      # only thing on the import path is what was actually packaged.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl

      - name: Smoke-test the INSTALLED artifact
        working-directory: /tmp
        run: |
          set -eux
          # Documented entry points must exist and respond.
          /tmp/smoke-venv/bin/whispersync --help > /dev/null
          test -x /tmp/smoke-venv/bin/whispersync-gui
          # Modules the CLI imports LATE (e.g. --verify, after a completed sync
          # run) must be importable from the installed package, not only from a
          # checkout.
          /tmp/smoke-venv/bin/python -c "
          from whispersync.engine.verify import measure
          from whispersync.engine.pipeline import run_pipeline
          from whispersync.engine.export import generate_fcpxml
          print('engine imports OK')
          "
          # Package resources must be present in the wheel, not just on disk
          # next to the source.
          /tmp/smoke-venv/bin/python -c "
          import importlib.resources
          qss = importlib.resources.files('whispersync.gui').joinpath('theme.qss').read_text()
          assert qss.strip(), 'theme.qss is empty or missing from the wheel'
          print('package resources OK (%d bytes of QSS)' % len(qss))
          "

      - name: Verify the sdist builds a wheel too
        run: |
          python -m pip install --upgrade build
          mkdir -p /tmp/sdist-check
          tar -xzf dist/*.tar.gz -C /tmp/sdist-check
          cd /tmp/sdist-check/*/
          python -m build --wheel

  cross-platform:
    name: Import smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # "OS Independent" was a claim in the metadata that nothing verified —
      # CI ran on Linux only, so the Windows-specific paths (Scripts/ vs bin/,
      # path-to-URI conversion) were untested on the platforms they exist for.
      # This is a cheap smoke, not a full run: no ffmpeg, no GPU.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import and run the platform-sensitive tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import whispersync.cli, whispersync.engine.pipeline, whispersync.engine.verify"
          python -m pytest -q -m "not integration" tests/test_media.py tests/test_export.py tests/test_separation.py tests/test_config.py
